<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SFU Compass</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Header -->
  <header class="bg-slate-950 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-red-900/30">SFU</div>
        <div>
          <h1 class="font-bold text-lg leading-tight">SFU Compass</h1>
          <p class="text-xs text-slate-400">Campus Navigation & Route Finder</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="connect-btn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all shadow">
          <span id="serial-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
          <span id="serial-btn-text">Connect Hardware</span>
        </button>
        <span id="serial-status" class="text-[10px] text-slate-400 bg-slate-950 px-2 py-1 rounded border border-slate-800">DISCONNECTED</span>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">
    
    <!-- Controls & Step Panel (Left) -->
    <div class="lg:col-span-4 flex flex-col gap-5">
      
      <!-- Selector Card -->
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-xl">
        <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-4 flex items-center gap-2">
          <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Select Waypoints
        </h2>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">START LOCATION</label>
            <select id="start-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm font-medium focus:ring-2 focus:ring-red-500 outline-none text-white"></select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">DESTINATION</label>
            <select id="dest-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm font-medium focus:ring-2 focus:ring-red-500 outline-none text-white"></select>
          </div>

          <button id="calc-btn" class="w-full py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl shadow-lg shadow-red-900/40 transition-all text-sm flex items-center justify-center gap-2">
            Calculate Route
          </button>
        </div>
      </div>

      <!-- Route Directions Steps -->
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-xl flex-grow flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Directions</h2>
          <span id="route-distance-badge" class="hidden text-xs bg-red-950 border border-red-800 text-red-400 font-bold px-2.5 py-0.5 rounded-full">0m</span>
        </div>

        <div id="active-step-indicator" class="text-[10px] text-slate-500 mb-2 font-mono">STEP 0/0</div>

        <div id="steps-container" class="space-y-2 overflow-y-auto max-h-[300px] pr-1">
          <p class="text-xs text-slate-500 italic">Select start and destination to calculate a path.</p>
        </div>

        <div id="path-summary" class="mt-4 pt-3 border-t border-slate-800/80 text-[11px] font-mono text-slate-400 break-words"></div>
      </div>

      <!-- Serial Debug Terminal -->
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 shadow-xl">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Hardware Console</h3>
        <div id="serial-log" class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 h-24 overflow-y-auto font-mono text-[10px] text-emerald-400 space-y-1">
          <div>> Console ready...</div>
        </div>
      </div>

    </div>

    <!-- Map Canvas Panel (Right) -->
    <div class="lg:col-span-8 flex flex-col gap-2">
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3 shadow-xl flex flex-col h-full">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
          <div class="text-xs text-slate-400 flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
            <span>Interactive Campus Map</span>
          </div>
          <div class="text-[11px] text-slate-500">Scroll to Zoom • Drag to Pan</div>
        </div>

        <div class="relative w-full h-[550px] lg:h-[680px] bg-slate-950 border border-slate-800 rounded-xl overflow-hidden flex items-center justify-center cursor-grab active:cursor-grabbing">
          <canvas id="map-canvas" class="w-full h-full object-contain"></canvas>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Landmark Config
    const LANDMARKS = [
      "WMC", "Library", "SUB", "MBC", "AQ", 
      "Shrum Chemistry", "Shrum Physics", "Shrum Biology", 
      "South Sciences", "ASB", "TASC1", "TASC2"
    ];

    const SHORT_NAMES = {
      "WMC": "WMC", "Library": "LIBRARY", "SUB": "SUB", "MBC": "MBC",
      "AQ": "AQ", "Shrum Chemistry": "SHRUM CHEM", "Shrum Physics": "SHRUM PHYS",
      "Shrum Biology": "SHRUM BIO", "South Sciences": "SOUTH SCI", "ASB": "ASB",
      "TASC1": "TASC 1", "TASC2": "TASC 2"
    };

    // Graph Distances
    const GRAPH = {
      "WMC": { "WMC_EAST": 25 },
      "WMC_EAST": { "WMC": 25, "LIBRARY_WEST": 120 },
      "LIBRARY_WEST": { "WMC_EAST": 120, "Library": 25, "CONVOCATION_WEST": 55 },
      "Library": { "LIBRARY_WEST": 25, "SUB": 70 },
      "SUB": { "Library": 70, "CONVOCATION_WEST": 55 },
      "CONVOCATION_WEST": { "LIBRARY_WEST": 55, "SUB": 55, "CONVOCATION_CENTRE": 60 },
      "CONVOCATION_CENTRE": { "CONVOCATION_WEST": 60, "MBC": 35, "AQ_WEST": 45 },
      "MBC": { "CONVOCATION_CENTRE": 35, "AQ_WEST": 45 },
      "AQ_WEST": { "CONVOCATION_CENTRE": 45, "MBC": 45, "AQ": 25, "AQ_SOUTH": 70 },
      "AQ": { "AQ_WEST": 25, "AQ_SOUTH": 55 },
      "AQ_SOUTH": { "AQ": 55, "AQ_WEST": 70, "SHRUM_NORTH": 45 },
      "SHRUM_NORTH": { "AQ_SOUTH": 45, "Shrum Chemistry": 30, "Shrum Physics": 40, "SHRUM_SOUTH": 60 },
      "Shrum Chemistry": { "SHRUM_NORTH": 30, "Shrum Physics": 45 },
      "Shrum Physics": { "SHRUM_NORTH": 40, "Shrum Chemistry": 45, "Shrum Biology": 55, "SHRUM_SOUTH": 45 },
      "Shrum Biology": { "Shrum Physics": 55, "SHRUM_SOUTH": 35 },
      "SHRUM_SOUTH": { "SHRUM_NORTH": 60, "Shrum Physics": 45, "Shrum Biology": 35, "South Sciences": 35, "ASB_WEST": 65 },
      "South Sciences": { "SHRUM_SOUTH": 35, "ASB_WEST": 50 },
      "ASB_WEST": { "SHRUM_SOUTH": 65, "South Sciences": 50, "ASB": 25, "TASC_JUNCTION": 85 },
      "ASB": { "ASB_WEST": 25, "TASC_JUNCTION": 75 },
      "TASC_JUNCTION": { "ASB_WEST": 85, "ASB": 75, "TASC1": 35, "TASC2": 55 },
      "TASC1": { "TASC_JUNCTION": 35, "TASC2": 50 },
      "TASC2": { "TASC_JUNCTION": 55, "TASC1": 50 }
    };

    // Coordinates for 1600x1100 Canvas
    const NODE_POSITIONS = {
      "WMC": { x: 700, y: 435 },
      "WMC_EAST": { x: 738, y: 445 },
      "LIBRARY_WEST": { x: 775, y: 470 },
      "Library": { x: 790, y: 512 },
      "SUB": { x: 812, y: 530 },
      "CONVOCATION_WEST": { x: 775, y: 445 },
      "CONVOCATION_CENTRE": { x: 820, y: 445 },
      "MBC": { x: 800, y: 548 },
      "AQ_WEST": { x: 832, y: 480 },
      "AQ": { x: 880, y: 480 },
      "AQ_SOUTH": { x: 855, y: 548 },
      "SHRUM_NORTH": { x: 865, y: 590 },
      "Shrum Chemistry": { x: 832, y: 590 },
      "Shrum Physics": { x: 872, y: 616 },
      "Shrum Biology": { x: 920, y: 616 },
      "SHRUM_SOUTH": { x: 880, y: 660 },
      "South Sciences": { x: 855, y: 694 },
      "ASB_WEST": { x: 920, y: 676 },
      "ASB": { x: 944, y: 660 },
      "TASC_JUNCTION": { x: 984, y: 650 },
      "TASC1": { x: 992, y: 608 },
      "TASC2": { x: 1032, y: 608 }
    };

    // Map Image Setup
    const mapImage = new Image();
    mapImage.crossOrigin = "anonymous";
    mapImage.src = "./sfu_map.jpg";

    const canvas = document.getElementById("map-canvas");
    const ctx = canvas.getContext("2d");

    // Zoom & Pan Setup
    let scale = 1.3;
    let panX = -250;
    let panY = -150;
    let isDragging = false;
    let startX, startY;

    mapImage.onload = () => drawMap();
    mapImage.onerror = () => {
      mapImage.src = "https://raw.githubusercontent.com/Waog88/SFU-Compass/main/sfu_map.jpg";
    };

    function dijkstra(start, destination) {
      const distances = {};
      const previous = {};
      const nodes = Object.keys(GRAPH);

      nodes.forEach(node => {
        distances[node] = Infinity;
        previous[node] = null;
      });

      distances[start] = 0;
      const unvisited = new Set(nodes);

      while (unvisited.size > 0) {
        let current = null;
        let lowestDist = Infinity;

        unvisited.forEach(node => {
          if (distances[node] < lowestDist) {
            lowestDist = distances[node];
            current = node;
          }
        });

        if (current === null || current === destination) break;
        unvisited.delete(current);

        for (const neighbor in GRAPH[current]) {
          if (unvisited.has(neighbor)) {
            const alt = distances[current] + GRAPH[current][neighbor];
            if (alt < distances[neighbor]) {
              distances[neighbor] = alt;
              previous[neighbor] = current;
            }
          }
        }
      }

      if (distances[destination] === Infinity) return { path: [], distance: Infinity };

      const path = [];
      let curr = destination;
      while (curr !== null) {
        path.unshift(curr);
        curr = previous[curr];
      }

      return { path, distance: distances[destination] };
    }

    function buildSteps(fullPath) {
      if (!fullPath || fullPath.length === 0) return [];
      const steps = [];
      let currentLandmark = null;
      let distanceSinceLandmark = 0;

      fullPath.forEach((node, index) => {
        if (index === 0) {
          if (LANDMARKS.includes(node)) currentLandmark = node;
          return;
        }

        const prevNode = fullPath[index - 1];
        distanceSinceLandmark += GRAPH[prevNode][node];

        if (LANDMARKS.includes(node)) {
          if (currentLandmark !== null) {
            steps.push({
              from: currentLandmark,
              to: node,
              displayName: SHORT_NAMES[node] || node,
              distance: distanceSinceLandmark
            });
          }
          currentLandmark = node;
          distanceSinceLandmark = 0;
        }
      });

      return steps;
    }

    const startSelect = document.getElementById("start-select");
    const destSelect = document.getElementById("dest-select");
    const stepsContainer = document.getElementById("steps-container");
    const distBadge = document.getElementById("route-distance-badge");
    const pathSummary = document.getElementById("path-summary");
    const serialLog = document.getElementById("serial-log");
    const activeStepIndicator = document.getElementById("active-step-indicator");

    let currentRoutePath = [];
    let currentSteps = [];
    let activeStepSegment = 0;

    let port = null;
    let writer = null;

    function initSelects() {
      LANDMARKS.forEach(landmark => {
        const opt1 = document.createElement("option");
        opt1.value = landmark;
        opt1.textContent = landmark;
        startSelect.appendChild(opt1);

        const opt2 = document.createElement("option");
        opt2.value = landmark;
        opt2.textContent = landmark;
        destSelect.appendChild(opt2);
      });

      startSelect.value = "WMC";
      destSelect.value = "TASC1";
    }

    function setupCanvasSize() {
      canvas.width = 1600;
      canvas.height = 1100;
      drawMap();
    }

    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(panX, panY);
      ctx.scale(scale, scale);

      if (mapImage.complete && mapImage.naturalWidth !== 0) {
        ctx.drawImage(mapImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Base network
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(71, 85, 105, 0.5)";
      for (const node in GRAPH) {
        const startPos = NODE_POSITIONS[node];
        for (const neighbor in GRAPH[node]) {
          const endPos = NODE_POSITIONS[neighbor];
          if (startPos && endPos) {
            ctx.beginPath();
            ctx.moveTo(startPos.x, startPos.y);
            ctx.lineTo(endPos.x, endPos.y);
            ctx.stroke();
          }
        }
      }

      // Highlighted Route
      if (currentRoutePath.length > 1) {
        ctx.shadowColor = "#ef4444";
        ctx.shadowBlur = 15;
        ctx.lineWidth = 8;
        ctx.strokeStyle = "#dc2626";
        
        ctx.beginPath();
        for (let i = 0; i < currentRoutePath.length - 1; i++) {
          const u = NODE_POSITIONS[currentRoutePath[i]];
          const v = NODE_POSITIONS[currentRoutePath[i + 1]];
          if (u && v) {
            ctx.moveTo(u.x, u.y);
            ctx.lineTo(v.x, v.y);
          }
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Landmark Nodes & Text Labels
      for (const node in NODE_POSITIONS) {
        const pos = NODE_POSITIONS[node];
        const isLandmark = LANDMARKS.includes(node);
        const isSelected = currentRoutePath.includes(node);

        ctx.beginPath();
        ctx.arc(pos.x, pos.y, isLandmark ? 11 : 5, 0, Math.PI * 2);

        if (isSelected) {
          ctx.fillStyle = "#ef4444";
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 3;
        } else if (isLandmark) {
          ctx.fillStyle = "#991b1b";
          ctx.strokeStyle = "#fca5a5";
          ctx.lineWidth = 2;
        } else {
          ctx.fillStyle = "#f59e0b";
          ctx.strokeStyle = "#78350f";
          ctx.lineWidth = 1.5;
        }
        
        ctx.fill();
        ctx.stroke();

        if (isLandmark) {
          const labelText = node;
          ctx.font = isSelected ? "bold 15px sans-serif" : "bold 13px sans-serif";
          const textWidth = ctx.measureText(labelText).width;

          ctx.fillStyle = isSelected ? "rgba(185, 28, 28, 0.9)" : "rgba(15, 23, 42, 0.85)";
          ctx.fillRect(pos.x + 14, pos.y - 12, textWidth + 10, 20);
          ctx.strokeStyle = isSelected ? "#fca5a5" : "#475569";
          ctx.lineWidth = 1;
          ctx.strokeRect(pos.x + 14, pos.y - 12, textWidth + 10, 20);

          ctx.fillStyle = "#ffffff";
          ctx.fillText(labelText, pos.x + 19, pos.y + 2);
        }
      }

      ctx.restore();
    }

    // Pan / Zoom Controls
    canvas.addEventListener("mousedown", (e) => {
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    canvas.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      drawMap();
    });

    canvas.addEventListener("mouseup", () => isDragging = false);
    canvas.addEventListener("mouseleave", () => isDragging = false);

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (e.deltaY < 0) {
        scale = Math.min(scale * 1.1, 3.5);
      } else {
        scale = Math.max(scale / 1.1, 0.6);
      }
      drawMap();
    }, { passive: false });

    function calculateAndDisplay() {
      const start = startSelect.value;
      const dest = destSelect.value;

      if (start === dest) {
        stepsContainer.innerHTML = `<p class="text-xs text-amber-400 py-2">Start location and destination are identical.</p>`;
        currentRoutePath = [];
        drawMap();
        return;
      }

      const { path, distance } = dijkstra(start, dest);
      currentRoutePath = path;
      currentSteps = buildSteps(path);
      activeStepSegment = 0;

      distBadge.textContent = `${distance}m`;
      distBadge.classList.remove("hidden");

      renderStepList();

      pathSummary.textContent = `Route: ${path.join(" → ")}`;
      logSerial(`Route computed: ${start} -> ${dest} (${distance}m)`);
      drawMap();
    }

    function renderStepList() {
      stepsContainer.innerHTML = "";
      activeStepIndicator.textContent = `STEP ${activeStepSegment + 1}/${currentSteps.length}`;

      currentSteps.forEach((step, idx) => {
        const isActive = idx === activeStepSegment;
        const item = document.createElement("div");
        item.className = `p-3 rounded-xl flex items-center justify-between border transition-all ${
          isActive 
            ? "bg-red-950/70 border-red-500 shadow-md scale-[1.01]" 
            : "bg-slate-900 border-slate-800 opacity-80"
        }`;
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-full ${isActive ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-400'} font-bold text-xs flex items-center justify-center border border-slate-700">${idx + 1}</span>
            <div>
              <div class="text-xs font-bold ${isActive ? 'text-white' : 'text-slate-300'}">${step.from} → ${step.to}</div>
              <div class="text-[10px] text-slate-500">Short Name: ${step.displayName}</div>
            </div>
          </div>
          <span class="text-xs font-mono font-bold ${isActive ? 'text-red-400' : 'text-slate-400'}">${step.distance}m</span>
        `;
        stepsContainer.appendChild(item);
      });
    }

    function logSerial(msg) {
      const entry = document.createElement("div");
      entry.textContent = `> ${msg}`;
      serialLog.appendChild(entry);
      serialLog.scrollTop = serialLog.scrollHeight;
    }

    document.getElementById("connect-btn").addEventListener("click", async () => {
      if ("serial" in navigator) {
        try {
          port = await navigator.serial.requestPort();
          await port.open({ baudRate: 115200 });
          document.getElementById("serial-status").textContent = "CONNECTED";
          document.getElementById("serial-status").className = "text-[10px] text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800";
          document.getElementById("serial-btn-text").textContent = "Serial Connected";
          document.getElementById("serial-dot").className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
          logSerial("Connected to Serial!");
        } catch (err) {
          logSerial("Connection error: " + err.message);
        }
      } else {
        alert("Web Serial API is supported on Chrome and Edge.");
      }
    });

    document.getElementById("calc-btn").addEventListener("click", () => calculateAndDisplay());

    initSelects();
    setupCanvasSize();
    calculateAndDisplay();
  </script>
</body>
</html>
